<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto DevOps - 故障诊断AI助手</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .message-animation {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator::after {
            content: '...';
            animation: typing 1.5s infinite;
        }

        @keyframes typing {
            0%, 60%, 100% { opacity: 1; }
            30% { opacity: 0.3; }
        }

        .stream-message {
            border-left: 3px solid #3b82f6;
            background: linear-gradient(to right, rgba(59, 130, 246, 0.05), transparent);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-500 text-white p-2 rounded-lg">
                        <i class="ri-robot-line text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">Auto DevOps</h1>
                        <p class="text-sm text-gray-500">故障诊断AI助手</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="healthBtn" class="px-3 py-1 text-sm bg-green-100 text-green-700 rounded-lg hover:bg-green-200 transition-colors">
                        <i class="ri-heart-pulse-line mr-1"></i>
                        健康检查
                    </button>
                    <a href="/docs" target="_blank" class="px-3 py-1 text-sm bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-colors">
                        <i class="ri-book-line mr-1"></i>
                        API文档
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Chat Section -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <!-- Chat Header -->
                    <div class="bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-lg font-semibold text-white">
                                <i class="ri-chat-3-line mr-2"></i>
                                智能诊断对话
                            </h2>
                            <button id="clearChat" class="px-3 py-1 text-sm bg-white/20 text-white rounded-lg hover:bg-white/30 transition-colors">
                                <i class="ri-delete-bin-line mr-1"></i>
                                清空对话
                            </button>
                        </div>
                    </div>

                    <!-- Chat Messages -->
                    <div id="chatMessages" class="h-96 overflow-y-auto p-6 space-y-4 bg-gray-50">
                        <!-- Welcome Message -->
                        <div class="text-center py-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                                <i class="ri-robot-2-line text-2xl text-blue-600"></i>
                            </div>
                            <h3 class="text-lg font-medium text-gray-900 mb-2">欢迎使用故障诊断AI助手</h3>
                            <p class="text-gray-600 max-w-md mx-auto">
                                我可以帮助您分析发布流水线中的故障问题，请描述您遇到的问题。
                            </p>
                        </div>
                    </div>

                    <!-- Chat Input -->
                    <div class="border-t border-gray-200 p-4 bg-white">
                        <form id="chatForm" class="flex space-x-3">
                            <input
                                type="text"
                                id="messageInput"
                                placeholder="描述您遇到的故障问题..."
                                class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none"
                                required
                            >
                            <div class="flex space-x-2">
                                <button
                                    type="submit"
                                    class="px-4 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors flex items-center"
                                >
                                    <i class="ri-send-plane-fill mr-2"></i>
                                    发送
                                </button>
                                <button
                                    type="button"
                                    id="streamBtn"
                                    class="px-4 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors flex items-center"
                                    title="流式对话"
                                >
                                    <i class="ri-pulse-line mr-2"></i>
                                    流式
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Info Section -->
            <div class="space-y-6">
                <!-- System Status -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">
                        <i class="ri-dashboard-3-line mr-2 text-blue-500"></i>
                        系统状态
                    </h3>
                    <div id="systemStatus" class="space-y-3">
                        <div class="flex items-center justify-between py-2 border-b border-gray-100">
                            <span class="text-sm text-gray-600">服务状态</span>
                            <span id="serviceStatus" class="text-sm font-medium text-gray-400">检查中...</span>
                        </div>
                        <div class="flex items-center justify-between py-2 border-b border-gray-100">
                            <span class="text-sm text-gray-600">响应时间</span>
                            <span id="responseTime" class="text-sm font-medium text-gray-400">-</span>
                        </div>
                        <div class="flex items-center justify-between py-2">
                            <span class="text-sm text-gray-600">API版本</span>
                            <span class="text-sm font-medium text-gray-900">v1.0.0</span>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">
                        <i class="ri-flashlight-line mr-2 text-yellow-500"></i>
                        快速操作
                    </h3>
                    <div class="space-y-2">
                        <button class="quick-action w-full text-left px-4 py-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors text-sm" data-message="发布任务失败，请分析原因">
                            <i class="ri-bug-line mr-2 text-red-500"></i>
                            发布任务失败诊断
                        </button>
                        <button class="quick-action w-full text-left px-4 py-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors text-sm" data-message="健康检查失败，端口无法访问">
                            <i class="ri-shield-check-line mr-2 text-orange-500"></i>
                            健康检查问题分析
                        </button>
                        <button class="quick-action w-full text-left px-4 py-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors text-sm" data-message="服务启动异常，请检查日志">
                            <i class="ri-server-line mr-2 text-blue-500"></i>
                            服务启动问题排查
                        </button>
                        <button class="quick-action w-full text-left px-4 py-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors text-sm" data-message="容器部署失败，请分析原因">
                            <i class="ri-container-line mr-2 text-green-500"></i>
                            容器部署问题诊断
                        </button>
                    </div>
                </div>

                <!-- Help -->
                <div class="bg-blue-50 rounded-xl p-6 border border-blue-200">
                    <h3 class="text-lg font-semibold text-blue-900 mb-3">
                        <i class="ri-question-line mr-2"></i>
                        使用帮助
                    </h3>
                    <ul class="space-y-2 text-sm text-blue-800">
                        <li class="flex items-start">
                            <i class="ri-checkbox-circle-line mr-2 mt-0.5 flex-shrink-0"></i>
                            <span>详细描述您遇到的故障问题</span>
                        </li>
                        <li class="flex items-start">
                            <i class="ri-checkbox-circle-line mr-2 mt-0.5 flex-shrink-0"></i>
                            <span>可以使用流式模式获得实时反馈</span>
                        </li>
                        <li class="flex items-start">
                            <i class="ri-checkbox-circle-line mr-2 mt-0.5 flex-shrink-0"></i>
                            <span>查看API文档了解更多接口</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <div class="text-center text-sm text-gray-500">
                <p>Auto DevOps - 故障诊断AI助手 | Powered by FastAPI & LangChain</p>
            </div>
        </div>
    </footer>

    <script>
        // 全局变量
        let isStreaming = false;
        let eventSource = null;

        // DOM元素
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const clearChatBtn = document.getElementById('clearChat');
        const streamBtn = document.getElementById('streamBtn');
        const healthBtn = document.getElementById('healthBtn');
        const serviceStatus = document.getElementById('serviceStatus');
        const responseTime = document.getElementById('responseTime');

        // 添加消息到聊天区域
        function addMessage(content, isUser = false, isStream = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} message-animation`;

            const messageContent = document.createElement('div');
            messageContent.className = `max-w-lg ${isUser
                ? 'bg-blue-500 text-white rounded-2xl rounded-br-sm'
                : isStream
                    ? 'bg-blue-50 text-gray-900 rounded-2xl rounded-bl-sm border border-blue-200 stream-message'
                    : 'bg-white text-gray-900 rounded-2xl rounded-bl-sm border border-gray-200'
            } px-4 py-3 shadow-sm`;

            if (!isUser) {
                messageContent.innerHTML = `
                    <div class="flex items-start space-x-2">
                        <div class="flex-shrink-0">
                            <i class="ri-robot-line text-blue-500"></i>
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-medium text-gray-900 mb-1">AI助手</div>
                            <div class="text-sm ${isStream ? 'text-blue-900' : 'text-gray-700'}">${content}</div>
                        </div>
                    </div>
                `;
            } else {
                messageContent.innerHTML = `
                    <div class="text-sm">${content}</div>
                `;
            }

            messageDiv.appendChild(messageContent);

            // 如果不是流式消息，清除欢迎消息
            if (!isStream && chatMessages.querySelector('.text-center')) {
                chatMessages.innerHTML = '';
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageDiv;
        }

        // 发送消息
        async function sendMessage(message, isStream = false) {
            // 添加用户消息
            addMessage(message, true);

            // 清空输入框
            messageInput.value = '';

            if (isStream) {
                sendStreamMessage(message);
            } else {
                sendNormalMessage(message);
            }
        }

        // 发送普通消息
        async function sendNormalMessage(message) {
            try {
                const startTime = Date.now();

                // 添加加载消息
                const loadingDiv = addMessage('正在分析问题...', false, false);
                const loadingContent = loadingDiv.querySelector('.text-gray-700');

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        user_id: 'web_user'
                    })
                });

                const endTime = Date.now();
                updateResponseTime(endTime - startTime);

                const result = await response.json();

                // 移除加载消息
                loadingDiv.remove();

                // 添加AI回复
                addMessage(result.response || '抱歉，我遇到了一些问题，请稍后再试。', false, false);

            } catch (error) {
                console.error('发送消息失败:', error);
                addMessage('网络连接失败，请检查服务是否正常运行。', false, false);
            }
        }

        // 发送流式消息
        function sendStreamMessage(message) {
            if (eventSource) {
                eventSource.close();
            }

            isStreaming = true;
            streamBtn.disabled = true;
            streamBtn.innerHTML = '<i class="ri-loader-4-line animate-spin mr-2"></i>对话中...';

            // 创建流式消息容器
            const streamDiv = addMessage('', false, true);
            const streamContent = streamDiv.querySelector('.text-blue-900');
            let fullContent = '';

            try {
                eventSource = new EventSource('/api/chat/stream?' + new URLSearchParams({
                    message: message,
                    user_id: 'web_user'
                }));

                eventSource.onmessage = function(event) {
                    try {
                        const chunk = JSON.parse(event.data);

                        if (chunk.type === 'start') {
                            streamContent.innerHTML = '<div class="typing-indicator text-blue-600">开始分析</div>';
                        } else if (chunk.type === 'thinking') {
                            streamContent.innerHTML = `<div class="typing-indicator text-blue-600">正在思考 (第${chunk.iteration}步)</div>`;
                        } else if (chunk.type === 'tool_call') {
                            streamContent.innerHTML = `<div class="text-blue-700"><i class="ri-tools-line mr-1"></i>调用工具: ${chunk.tool}</div>`;
                        } else if (chunk.type === 'tool_result') {
                            streamContent.innerHTML = `<div class="text-blue-700"><i class="ri-check-line mr-1"></i>工具结果: ${chunk.result.substring(0, 50)}...</div>`;
                        } else if (chunk.type === 'final') {
                            streamContent.innerHTML = `<div class="whitespace-pre-wrap">${chunk.content}</div>`;
                            isStreaming = false;
                            streamBtn.disabled = false;
                            streamBtn.innerHTML = '<i class="ri-pulse-line mr-2"></i>流式';
                            eventSource.close();
                        } else if (chunk.type === 'error') {
                            streamContent.innerHTML = `<div class="text-red-600"><i class="ri-error-warning-line mr-1"></i>${chunk.message}</div>`;
                            isStreaming = false;
                            streamBtn.disabled = false;
                            streamBtn.innerHTML = '<i class="ri-pulse-line mr-2"></i>流式';
                            eventSource.close();
                        }

                        chatMessages.scrollTop = chatMessages.scrollHeight;

                    } catch (e) {
                        console.error('解析流数据失败:', e);
                    }
                };

                eventSource.onerror = function(event) {
                    console.error('流式连接错误:', event);
                    streamContent.innerHTML = '<div class="text-red-600"><i class="ri-error-warning-line mr-1"></i>连接失败，请重试</div>';
                    isStreaming = false;
                    streamBtn.disabled = false;
                    streamBtn.innerHTML = '<i class="ri-pulse-line mr-2"></i>流式';
                    eventSource.close();
                };

            } catch (error) {
                console.error('发起流式请求失败:', error);
                streamContent.innerHTML = '<div class="text-red-600"><i class="ri-error-warning-line mr-1"></i>请求失败</div>';
                isStreaming = false;
                streamBtn.disabled = false;
                streamBtn.innerHTML = '<i class="ri-pulse-line mr-2"></i>流式';
            }
        }

        // 清空聊天记录
        function clearChat() {
            chatMessages.innerHTML = `
                <div class="text-center py-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                        <i class="ri-robot-2-line text-2xl text-blue-600"></i>
                    </div>
                    <h3 class="text-lg font-medium text-gray-900 mb-2">欢迎使用故障诊断AI助手</h3>
                    <p class="text-gray-600 max-w-md mx-auto">
                        我可以帮助您分析发布流水线中的故障问题，请描述您遇到的问题。
                    </p>
                </div>
            `;
        }

        // 健康检查
        async function checkHealth() {
            try {
                const startTime = Date.now();
                const response = await fetch('/api/health');
                const endTime = Date.now();

                if (response.ok) {
                    const result = await response.json();
                    serviceStatus.innerHTML = '<span class="text-green-600"><i class="ri-checkbox-circle-fill mr-1"></i>正常</span>';
                    updateResponseTime(endTime - startTime);
                } else {
                    serviceStatus.innerHTML = '<span class="text-red-600"><i class="ri-error-warning-fill mr-1"></i>异常</span>';
                }
            } catch (error) {
                serviceStatus.innerHTML = '<span class="text-red-600"><i class="ri-wifi-off-line mr-1"></i>离线</span>';
                responseTime.textContent = '-';
            }
        }

        // 更新响应时间
        function updateResponseTime(time) {
            responseTime.textContent = `${time}ms`;
            responseTime.className = 'text-sm font-medium ' + (time < 200 ? 'text-green-600' : time < 500 ? 'text-yellow-600' : 'text-red-600');
        }

        // 事件监听器
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (message && !isStreaming) {
                sendMessage(message, false);
            }
        });

        streamBtn.addEventListener('click', () => {
            const message = messageInput.value.trim();
            if (message && !isStreaming) {
                sendMessage(message, true);
            }
        });

        clearChatBtn.addEventListener('click', clearChat);
        healthBtn.addEventListener('click', checkHealth);

        // 快速操作按钮
        document.querySelectorAll('.quick-action').forEach(btn => {
            btn.addEventListener('click', () => {
                const message = btn.dataset.message;
                messageInput.value = message;
                messageInput.focus();
            });
        });

        // 定期健康检查
        setInterval(checkHealth, 30000); // 每30秒检查一次

        // 初始化
        checkHealth();

        // 页面卸载时关闭连接
        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>
</html>
